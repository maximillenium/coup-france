# Docker Compose for CoupFranc on a self-managed Linux VPS (Ubuntu/Debian)
# Self-contained, persistent volume storage with zero external database dependencies.

services:
  # Web Application (Node.js 22 + Express + Vite React client)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coupfranc_app
    restart: unless-stopped
    ports:
      # Expose only to localhost (reverse proxy Nginx routes public traffic)
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=${APP_URL:-https://coupfranc.fr}
      # Required in production: fail fast if unset or empty; no default fallback secret
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET environment variable is required. Generate one with: openssl rand -hex 32}
      # Reverse proxy hops: 1 for Nginx on host; adjust to 2 if behind Cloudflare/CDN
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-1}
    volumes:
      # Persistent volume for atomic database (database.json) and uploads (data/uploads)
      - coupfranc_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  coupfranc_data:
    name: coupfranc_data
